[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = [
    "E", "W",  # стиль PEP8
    "F",       # ошибки: неиспользуемые импорты и переменные
    "I",       # порядок импортов
    "N",       # именование по PEP8
    "ANN",     # подсказки типов у функций
    "D1",      # наличие докстрингов
]
ignore = ["D100", "D104"]  # докстринги у модулей и пакетов не требуем